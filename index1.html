<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunettes AR — Navigation</title>
<style>
  :root { --bg:#0e1420; --card:#18202f; --line:#2a3548; --txt:#e8edf6; --mute:#8d9bb3; --blue:#3b7bff; --ok:#2ecc71; --ko:#ff5b5b; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px; background:var(--bg); color:var(--txt); font:15px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif; max-width:560px; margin-inline:auto; }
  h1 { font-size:19px; margin:4px 0 14px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:0 0 10px; }
  button { background:var(--blue); color:#fff; border:0; border-radius:8px; padding:10px 14px; font-size:15px; cursor:pointer; margin:2px 4px 2px 0; }
  button.sec { background:#2a3548; }
  button:disabled { opacity:.4; cursor:default; }
  input, select { background:#0e1420; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:15px; width:100%; margin-bottom:6px; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .row input { flex:1; width:auto; margin:0; min-width:120px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--ko); margin-right:6px; }
  .dot.on { background:var(--ok); }
  .lcd { background:#1f3b1f; color:#b6f5a3; font:22px/1.3 "Courier New",monospace; padding:10px 14px; border-radius:6px; min-height:58px; letter-spacing:.08em; white-space:pre; }
  .res { display:block; width:100%; text-align:left; background:#0e1420; border:1px solid var(--line); font-size:13px; }
  #log { font:12px/1.4 monospace; color:var(--mute); max-height:150px; overflow:auto; white-space:pre-wrap; }
  small, .mute { color:var(--mute); }
</style>
</head>
<body>

<h1>🕶️ Lunettes AR — Navigation</h1>

<section>
  <h2>1. Lunettes (BLE)</h2>
  <div><span class="dot" id="dot"></span><span id="bleState">Non connecté</span></div>
  <button id="btnConnect">Connecter les lunettes</button>
</section>

<section>
  <h2>2. Destination</h2>
  <div class="row">
    <input id="q" placeholder="Adresse ou lieu (ou « lat, lon »)">
    <button id="btnSearch">Chercher</button>
  </div>
  <div id="results"></div>
  <p id="destInfo" class="mute" style="margin:8px 0 6px">Aucune destination choisie.</p>
  <select id="mode">
    <option value="car">Voiture (serveur OSRM)</option>
    <option value="foot">À pied (routing.openstreetmap.de)</option>
  </select>
  <button id="btnRoute" disabled>Calculer l'itinéraire</button>
  <p id="routeInfo" class="mute" style="margin:6px 0 0"></p>
</section>

<section>
  <h2>3. Guidage</h2>
  <button id="btnStart" disabled>▶ Démarrer (GPS réel)</button>
  <button id="btnSim" class="sec" disabled>⏵ Simuler</button>
  <button id="btnStop" class="sec" disabled>■ Arrêter</button>
  <div class="row" style="margin-top:6px">
    <small>Vitesse simulée (km/h)</small>
    <input id="simSpeed" type="number" value="40" min="5" max="200" style="max-width:90px">
  </div>
  <p id="navInfo" style="margin:10px 0 8px">—</p>
  <div class="lcd" id="lcd">(rien envoyé)</div>
  <small>Aperçu de ce que l'écran des lunettes doit afficher.</small>
</section>

<section>
  <h2>Tests manuels</h2>
  <button class="sec" data-msg="R,120">R,120</button>
  <button class="sec" data-msg="L,50">L,50</button>
  <button class="sec" data-msg="S,1500">S,1500</button>
  <button class="sec" data-msg="ROUND,80">ROUND,80</button>
  <button class="sec" data-msg="END,0">END,0</button>
  <div class="row" style="margin-top:6px">
    <input id="free" placeholder="Message libre">
    <button id="btnFree">Envoyer</button>
  </div>
</section>

<section>
  <h2>Journal</h2>
  <div id="log"></div>
</section>

<script>
"use strict";
const SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const $ = id => document.getElementById(id);
const ARROWS = { R:"→", L:"←", S:"↑", U:"↩", ROUND:"⟳", END:"⚑" };

function log(m) {
  const el = $("log");
  el.textContent = new Date().toLocaleTimeString() + "  " + m + "\n" + el.textContent;
}

/* ---------- BLE ---------- */
let device = null, rxChar = null, queue = Promise.resolve();

function setBle(on, txt) {
  $("dot").classList.toggle("on", on);
  $("bleState").textContent = txt || (on ? "Connecté à " + (device && device.name) : "Non connecté");
}

async function openGatt() {
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  rxChar = await svc.getCharacteristic(RX);
  setBle(true);
  log("BLE connecté");
}

async function onDisconnected() {
  rxChar = null;
  setBle(false, "Déconnecté, reconnexion…");
  for (let i = 0; i < 5; i++) {
    await new Promise(r => setTimeout(r, 1500));
    try { await openGatt(); return; } catch (e) { log("Reconnexion " + (i + 1) + "/5 échouée"); }
  }
  setBle(false, "Déconnecté");
}

$("btnConnect").onclick = async () => {
  if (!navigator.bluetooth) {
    alert("Web Bluetooth n'est pas disponible dans ce navigateur.\nSur iPhone, utilise l'app Bluefy ; sur PC/Android, Chrome ou Edge.");
    return;
  }
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }, { name: "Lunettes-AR" }],
      optionalServices: [SERVICE]
    });
    device.addEventListener("gattserverdisconnected", onDisconnected);
    setBle(false, "Connexion…");
    await openGatt();
  } catch (e) {
    log("Connexion BLE annulée/échouée : " + e.message);
    setBle(false);
  }
};

function showPreview(msg) {
  const [code, d] = msg.split(",");
  if (d === undefined) { $("lcd").textContent = msg.slice(0, 16) + "\n" + msg.slice(16, 32); return; }
  const n = parseInt(d, 10);
  const dist = n >= 1000 ? (n / 1000).toFixed(1) + "km" : n + "m";
  $("lcd").textContent = dist + " " + (ARROWS[code] || code);
}

function send(msg) {
  showPreview(msg);
  if (!rxChar) { log("(non envoyé, BLE absent) " + msg); return; }
  const data = new TextEncoder().encode(msg);
  queue = queue
    .then(() => rxChar.writeValueWithoutResponse ? rxChar.writeValueWithoutResponse(data) : rxChar.writeValue(data))
    .then(() => log("→ " + msg))
    .catch(e => log("Erreur BLE : " + e.message));
}

document.querySelectorAll("button[data-msg]").forEach(b => b.onclick = () => send(b.dataset.msg));
$("btnFree").onclick = () => { const v = $("free").value.trim(); if (v) send(v); };

/* ---------- Géocodage (Nominatim / OpenStreetMap) ---------- */
let dest = null;

function chooseDest(lat, lon, label) {
  dest = { lat, lon };
  $("destInfo").textContent = "Destination : " + label;
  $("btnRoute").disabled = false;
  $("results").innerHTML = "";
}

$("btnSearch").onclick = async () => {
  const q = $("q").value.trim();
  if (!q) return;
  const m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m) { chooseDest(parseFloat(m[1]), parseFloat(m[2]), q); return; }
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=fr&q=" + encodeURIComponent(q);
    const list = await (await fetch(url)).json();
    const box = $("results"); box.innerHTML = "";
    if (!list.length) { box.textContent = "Aucun résultat."; return; }
    list.forEach(r => {
      const b = document.createElement("button");
      b.className = "res sec"; b.textContent = r.display_name;
      b.onclick = () => chooseDest(parseFloat(r.lat), parseFloat(r.lon), r.display_name);
      box.appendChild(b);
    });
  } catch (e) { log("Recherche échouée : " + e.message); }
};

/* ---------- Itinéraire (OSRM) ---------- */
let route = null;
const nav = { watch:null, sim:null, lastSeg:0, off:0, lastReroute:0, wake:null };

function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function maneuverCode(man) {
  const t = man.type, mod = man.modifier || "";
  if (t === "arrive") return "END";
  if (t === "roundabout" || t === "rotary" || t === "roundabout turn") return "ROUND";
  if (mod === "uturn") return "U";
  if (mod.includes("right")) return "R";
  if (mod.includes("left")) return "L";
  return "S";
}

function routeUrl(from, to) {
  const c = `${from[1]},${from[0]};${to[1]},${to[0]}`;
  const q = "?steps=true&geometries=geojson&overview=full";
  return $("mode").value === "foot"
    ? `https://routing.openstreetmap.de/routed-foot/route/v1/driving/${c}${q}`
    : `https://router.project-osrm.org/route/v1/driving/${c}${q}`;
}

async function fetchRoute(from) {
  const res = await fetch(routeUrl(from, [dest.lat, dest.lon]));
  const j = await res.json();
  if (j.code !== "Ok" || !j.routes.length) throw new Error(j.message || j.code || "pas d'itinéraire");
  const r = j.routes[0];
  const coords = r.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
  const cum = [0];
  for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + haversine(coords[i - 1], coords[i]));
  const rawSteps = r.legs.flatMap(l => l.steps);
  const sumDist = rawSteps.reduce((s, x) => s + x.distance, 0) || 1;
  const ratio = cum[cum.length - 1] / sumDist;     // recale les distances des étapes sur la géométrie
  let acc = 0;
  const steps = rawSteps.map(s => {
    const o = { start: acc * ratio, code: maneuverCode(s.maneuver), type: s.maneuver.type, mod: s.maneuver.modifier || "", name: s.name || "" };
    acc += s.distance;
    return o;
  });
  route = { coords, cum, steps, total: cum[cum.length - 1] };
  nav.lastSeg = 0; nav.off = 0;
  $("routeInfo").textContent = `Itinéraire : ${(route.total / 1000).toFixed(1)} km, ${steps.length} étapes (~${Math.round(r.duration / 60)} min)`;
  $("btnStart").disabled = false; $("btnSim").disabled = false;
  log("Itinéraire calculé : " + steps.map(s => s.code).join(" "));
}

function getPosition() {
  return new Promise((ok, ko) => navigator.geolocation.getCurrentPosition(
    p => ok([p.coords.latitude, p.coords.longitude]), ko, { enableHighAccuracy: true, timeout: 15000 }));
}

$("btnRoute").onclick = async () => {
  try {
    $("routeInfo").textContent = "Calcul…";
    await fetchRoute(await getPosition());
  } catch (e) { $("routeInfo").textContent = "Échec : " + e.message; log("Itinéraire échoué : " + e.message); }
};

/* ---------- Suivi de progression ---------- */
function project(p, from, to) {
  const k = Math.cos(p[0] * Math.PI / 180);
  const X = q => [(q[1] - p[1]) * 111320 * k, (q[0] - p[0]) * 110540];
  let best = null;
  to = Math.min(to, route.coords.length - 2);
  for (let i = from; i <= to; i++) {
    const a = X(route.coords[i]), b = X(route.coords[i + 1]);
    const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, -(a[0] * dx + a[1] * dy) / l2)) : 0;
    const d = Math.hypot(a[0] + t * dx, a[1] + t * dy);
    if (!best || d < best.d) best = { d, seg: i, along: route.cum[i] + t * (route.cum[i + 1] - route.cum[i]) };
  }
  return best;
}

function quantize(d) {
  if (d >= 1000) return Math.round(d / 50) * 50;
  if (d >= 100)  return Math.round(d / 10) * 10;
  return Math.round(d / 5) * 5;
}

let lastMsg = "";
function onPosition(lat, lon) {
  if (!route) return;
  const p = [lat, lon];
  let pr = project(p, Math.max(0, nav.lastSeg - 3), nav.lastSeg + 150);
  if (pr.d > 40) { const full = project(p, 0, route.coords.length - 2); if (full.d < pr.d) pr = full; }

  if (pr.d > 50) {                               // hors itinéraire
    nav.off++;
    $("navInfo").textContent = `Hors itinéraire (${Math.round(pr.d)} m)…`;
    if (nav.off >= 3 && Date.now() - nav.lastReroute > 15000) {
      nav.lastReroute = Date.now(); nav.off = 0;
      log("Recalcul de l'itinéraire");
      fetchRoute(p).catch(e => log("Recalcul échoué : " + e.message));
    }
    return;
  }
  nav.off = 0; nav.lastSeg = pr.seg;

  let i = route.steps.findIndex((s, idx) => idx >= 1 && s.start > pr.along + 3);
  if (i < 0) i = route.steps.length - 1;
  const step = route.steps[i];
  const dist = Math.max(0, quantize(step.start - pr.along));
  const msg = `${step.code},${dist}`;

  $("navInfo").textContent = `Prochaine manœuvre : ${step.code} dans ${dist} m ${step.name ? "(" + step.name + ")" : ""} — reste ${((route.total - pr.along) / 1000).toFixed(2)} km`;
  if (msg !== lastMsg) { lastMsg = msg; send(msg); }
}

/* ---------- Démarrage / simulation / arrêt ---------- */
async function keepAwake() {
  try { if ("wakeLock" in navigator) nav.wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}

function stopNav() {
  if (nav.watch !== null) navigator.geolocation.clearWatch(nav.watch);
  if (nav.sim) clearInterval(nav.sim);
  if (nav.wake) { nav.wake.release().catch(() => {}); nav.wake = null; }
  nav.watch = null; nav.sim = null; lastMsg = "";
  $("btnStop").disabled = true;
  $("btnStart").disabled = !route; $("btnSim").disabled = !route;
}

$("btnStart").onclick = () => {
  stopNav(); keepAwake();
  nav.watch = navigator.geolocation.watchPosition(
    pos => onPosition(pos.coords.latitude, pos.coords.longitude),
    err => log("GPS : " + err.message),
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
  $("btnStop").disabled = false; $("btnStart").disabled = true; $("btnSim").disabled = true;
  log("Guidage GPS démarré");
};

$("btnSim").onclick = () => {
  stopNav(); keepAwake();
  nav.lastSeg = 0;
  let travelled = 0, seg = 0;
  const speed = Math.max(5, parseFloat($("simSpeed").value) || 40) / 3.6;   // m/s
  nav.sim = setInterval(() => {
    travelled += speed;
    if (travelled >= route.total) { onPosition(...route.coords[route.coords.length - 1]); stopNav(); log("Simulation terminée"); return; }
    while (seg < route.cum.length - 2 && route.cum[seg + 1] < travelled) seg++;
    const f = (travelled - route.cum[seg]) / ((route.cum[seg + 1] - route.cum[seg]) || 1);
    const a = route.coords[seg], b = route.coords[seg + 1];
    onPosition(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f);
  }, 1000);
  $("btnStop").disabled = false; $("btnStart").disabled = true; $("btnSim").disabled = true;
  log("Simulation démarrée");
};

$("btnStop").onclick = () => { stopNav(); log("Guidage arrêté"); };
</script>
</body>
</html>
